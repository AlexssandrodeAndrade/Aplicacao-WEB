<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="text-center mb-4">Lista de Compras</h2>

                <div id="mensagem" class="text-center fw-bold mb-3"></div>

                <div class="input-group mb-3">
                    <input type="text" id="inputItem" class="form-control" placeholder="Digite um item">

                    <button class="btn btn-primary btn-add" onclick="salvarItem()">
                        Adicionar
                    </button>
                </div>

                <ul id="lista" class="list-group"></ul>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
