<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Carros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Carros e Marcas</a>

            <div class="navbar-nav">
                <a class="nav-link" href="marcas.html">Marcas</a>
                <a class="nav-link active" href="carros.html">Carros</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <strong id="tituloFormulario">Cadastrar Carro</strong>
                    </div>

                    <div class="card-body">
                        <div id="mensagem" class="alert d-none" role="alert"></div>

                        <form id="formCarro">
                            <input type="hidden" id="carroId">

                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo</label>
                                <input type="text" id="modelo" class="form-control" placeholder="Ex: Civic">
                            </div>

                            <div class="mb-3">
                                <label for="marcaId" class="form-label">Marca</label>
                                <select id="marcaId" class="form-select">
                                    <option value="">Selecione uma marca</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="ano" class="form-label">Ano</label>
                                <input type="number" id="ano" class="form-control" placeholder="Ex: 2020">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    Salvar
                                </button>

                                <button type="button" id="btnCancelar" class="btn btn-secondary d-none">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong>Carros cadastrados</strong>
                        <button id="btnAtualizar" class="btn btn-sm btn-outline-primary">
                            Atualizar
                        </button>
                    </div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Modelo</th>
                                        <th>Marca</th>
                                        <th>Ano</th>
                                        <th class="text-end">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaCarros">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">
                                            Carregando carros...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <a href="marcas.html" class="btn btn-primary mt-3">
                    Ir para marcas
                </a>
            </div>
        </div>
    </main>

    <script src="js/carros.js"></script>
</body>

</html>
