<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="text-center mb-4">Lista de Compras</h2>
                <div id="mensagem" class="d-none"></div>
                <form id="formCompra" class="mb-3">
                    <input type="hidden" id="inputId">

                    <div id="modoFormulario" class="alert alert-info text-center py-2 mb-3">
                        Modo cadastro: informe um item para adicionar na lista.
                    </div>

                    <div class="input-group">
                        <input type="text" id="inputItem" class="form-control" placeholder="Digite um item"
                            autocomplete="off">

                        <button type="submit" class="btn btn-primary btn-add">
                            Adicionar
                        </button>

                        <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">
                            Cancelar
                        </button>
                    </div>
                </form>

                <ul id="lista" class="list-group"></ul>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
