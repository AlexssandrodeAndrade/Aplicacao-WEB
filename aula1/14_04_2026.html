<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Linktree</title>
    <link rel="stylesheet" href="css/14_04_2026.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <main>
        <!-- Foto -->
        <img id="foto" src="/img/pacoca.jpg" alt="Minha Foto">

        <!-- Nome -->
        <h2 id="nome">Alexssandro</h2>

        <!-- Links -->
        <a class="link" href="https://github.com" target="_blank">GitHub</a>
        <a class="link" href="https://linkedin.com" target="_blank">LinkedIn</a>
        <a class="link" href="https://youtube.com" target="_blank">YouTube</a>
        <a class="link" href="https://instagram.com" target="_blank">Instagram</a>

        <div id="redes">
            <i class="fab fa-linkedin"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-github"></i>
            <i class="fab fa-youtube"></i>
        </div>

    </main>

</body>
</html>
