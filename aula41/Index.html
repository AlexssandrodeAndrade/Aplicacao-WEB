<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 41</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container-fluid py-4">
        <section class="row g-4">
            <div class="col-12 col-lg-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="h4 section-title">Dados de cadastro</h2>
                        <input type="text" id="nome" class="form-control mb-3" placeholder="Nome da música">
                        <input type="text" id="autor" class="form-control mb-3" placeholder="Autor">
                        <input type="text" id="duracao" class="form-control mb-3" placeholder="Duração">
                        <input type="text" id="colaborador" class="form-control mb-3" placeholder="Colaborador"
                            value="Alexssandro">
                        <input type="text" id="link" class="form-control mb-3" placeholder="Link">

                        <button id="btnSalvarMusica" class="btn btn-primary">Salvar</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <div class="mb-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h2 class="h4 section-title mb-0">Importar JSON</h2>

                                <div class="d-flex gap-2">
                                    <button id="btnColar" class="btn btn-secondary btn-sm">Colar</button>
                                    <button id="btnArquivo" class="btn btn-warning btn-sm">Carregar JSON</button>
                                    <button id="btnImportar" class="btn btn-primary btn-sm">Importar</button>
                                </div>
                            </div>

                            <textarea id="importarJson" class="form-control mb-3 textarea-json"
                                placeholder="Cole o JSON aqui"></textarea>
                        </div>

                        <div class="mb-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h2 class="h4 section-title mb-0">Exportar JSON</h2>
                                <div class="d-flex gap-2">
                                    <button id="btnCopiar" class="btn btn-secondary btn-sm">
                                        Copiar
                                    </button>

                                    <button id="btnExportar" class="btn btn-primary btn-sm">Exportar</button>
                                </div>
                            </div>

                            <textarea id="exportarJson" class="form-control mb-3 textarea-json" readonly></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <h2 class="h4 section-title">Listagem dos dados</h2>

                <div class="table-responsive tabela-area">
                    <table class="table table-hover table-bordered align-middle text-center mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>Nome</th>
                                <th>Autor</th>
                                <th>Duração</th>
                                <th>Colaborador</th>
                                <th>Link</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaMusicas"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="js/script_jquery.js"></script>
    <!-- <script src="js/script.js"></script> -->
</body>

</html>
