<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 25</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">Loja</h1>

        <div class="row g-4">

            <!-- Produto 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/not.jpg" class="card-img-top" alt="Produto 1">
                    <div class="card-body text-center">
                        <h5 class="card-title">Notebook Gamer</h5>
                        <p class="card-text fs-4 text-success">R$ 4.999,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Produto 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/celular.jpg" class="card-img-top" alt="Produto 2">
                    <div class="card-body text-center">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text fs-4 text-success">R$ 2.499,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Produto 3 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/fone.jpg" class="card-img-top" alt="Produto 3">
                    <div class="card-body text-center">
                        <h5 class="card-title">Headset</h5>
                        <p class="card-text fs-4 text-success">R$ 399,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Produto 4 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/teclado.jpg" class="card-img-top" alt="Produto 4">
                    <div class="card-body text-center">
                        <h5 class="card-title">Teclado Mecânico</h5>
                        <p class="card-text fs-4 text-success">R$ 299,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Produto 5 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/mouse.jpg" class="card-img-top" alt="Produto 5">
                    <div class="card-body text-center">
                        <h5 class="card-title">Mouse Gamer</h5>
                        <p class="card-text fs-4 text-success">R$ 199,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Produto 6 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow">
                    <img src="img/monitor.jpg" class="card-img-top" alt="Produto 6">
                    <div class="card-body text-center">
                        <h5 class="card-title">Monitor</h5>
                        <p class="card-text fs-4 text-success">R$ 1.299,90</p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
